<style>
  :root{
    --bg-1:#08090a;
    --bg-2:#0f1113;
    --case-1:#2b2c2e;
    --case-2:#131315;
    --case-shadow:#000000;
    --metal-1:#5a5c5f;
    --metal-2:#37383a;
    --metal-hi:#8a8c8f;
    --lcd-bg-1:#93a07c;
    --lcd-bg-2:#7c8a67;
    --lcd-ink:#232c19;
    --lcd-ghost:rgba(35,44,25,0.16);
    --lcd-line:rgba(35,44,25,0.25);
    --accent:#b23a2c;
    --accent-light:#d24f3d;
    --label:#e7e9ec;
    --btn-text:#cfd2d6;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    /* Definit aquí, al principi, perquè el media query de pantalla
       horitzontal baixa (més avall) el pugui sobreescriure. */
    --panel-width: clamp(300px, 48vw, 460px);
  }

  /* ============ TEMES DE COLOR (toc a la pantalla per canviar) ============ */
  :root[data-theme="ice"]{
    --lcd-bg-1:#c7d3da;
    --lcd-bg-2:#a9b9c4;
    --lcd-ink:#122636;
    --lcd-ghost:rgba(18,38,54,0.16);
    --lcd-line:rgba(18,38,54,0.25);
    --accent:#1f6fb2;
    --accent-light:#3f8ed1;
  }

  :root[data-theme="amber"]{
    --lcd-bg-1:#2b1b0e;
    --lcd-bg-2:#1a1008;
    --lcd-ink:#ffb454;
    --lcd-ghost:rgba(255,180,84,0.18);
    --lcd-line:rgba(255,180,84,0.28);
    --accent:#ff7a3d;
    --accent-light:#ffa268;
  }

  :root[data-theme="mono"]{
    --lcd-bg-1:#e9eaec;
    --lcd-bg-2:#d0d2d5;
    --lcd-ink:#131417;
    --lcd-ghost:rgba(19,20,23,0.15);
    --lcd-line:rgba(19,20,23,0.22);
    --accent:#a4291b;
    --accent-light:#c2402f;
  }

  /* Mode nocturn — blau molt fosc amb la informació en taronja tènue,
     a joc amb la pantalla nocturna del rellotge de l'iPhone en càrrega. */
  :root[data-theme="night"]{
    --bg-1:#020305;
    --bg-2:#03050a;
    --lcd-bg-1:#070d1c;
    --lcd-bg-2:#04070f;
    --lcd-ink:#b06a34;
    --lcd-ghost:rgba(176,106,52,0.12);
    --lcd-line:rgba(176,106,52,0.25);
    --accent:#b06a34;
    --accent-light:#c98047;
    /* Fora de la pantalla també: res de blanc brillant de nit. */
    --label:#8a5a33;
    --btn-text:#7a5233;
    --metal-1:#26272a;
    --metal-2:#161719;
  }

  *{
    box-sizing:border-box;
    transition: background-color .4s ease, color .4s ease, fill .4s ease;
  }

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(ellipse at 50% -10%, #1a1c1f 0%, var(--bg-2) 45%, var(--bg-1) 100%);
    color:var(--btn-text);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
  }

  /* 100dvh: Safari compta bé l'alçada real amb la barra visible.
     safe-area: un cop instal·lada a l'iPhone, el contingut no queda
     sota el notch ni la barra d'estat. */
  .page{
    --pad: clamp(16px, 4vw, 40px);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(20px, 4vh, 40px);
    padding:
      max(var(--pad), env(safe-area-inset-top))
      max(var(--pad), env(safe-area-inset-right))
      max(var(--pad), env(safe-area-inset-bottom))
      max(var(--pad), env(safe-area-inset-left));
  }

  /* En horitzontal, rellotge i calendari un al costat de l'altre, amb
     l'espai sobrant repartit a parts iguals (vores i entremig), perquè
     omplin l'amplada en lloc de quedar arraulits al centre. */
  @media (orientation:landscape) and (min-width:680px){
    .page{
      flex-direction:row;
      align-items:center;
      justify-content:space-evenly;
      gap:clamp(24px, 5vw, 64px);
    }
  }

  /* Pantalles horitzontals baixes (mòbil girat): el panell creix tant com
     permet l'alçada (88vh) sense passar del 42% de l'amplada. */
  @media (orientation:landscape) and (max-height:520px){
    :root{
      --panel-width: min(clamp(190px, 88vh, 420px), 42vw);
    }
    .page{
      --pad: clamp(8px, 2vh, 18px);
      flex-direction:row;
      align-items:center;
      justify-content:space-evenly;
      gap:clamp(12px, 3vh, 28px);
    }
  }

  /* ============ WATCH CASE ============ */

  .watch{
    position:relative;
    width:var(--panel-width);
    flex-shrink:0;
  }

  .watch-case{
    position:relative;
    background:linear-gradient(155deg, var(--case-1) 0%, var(--case-2) 60%, #0a0a0b 100%);
    border-radius:16%;
    padding:clamp(14px,3vw,20px);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,.7),
      0 2px 0 rgba(255,255,255,.04) inset,
      0 -6px 14px rgba(0,0,0,.5) inset;
  }

  .bezel{
    position:relative;
    border-radius:13%;
    padding:clamp(9px,1.8vw,13px);
    background:
      conic-gradient(from 220deg,
        var(--metal-hi), var(--metal-1) 15%, var(--metal-2) 35%,
        var(--metal-1) 55%, var(--metal-hi) 70%, var(--metal-2) 88%, var(--metal-hi));
    box-shadow:
      0 2px 3px rgba(0,0,0,.6) inset,
      0 -2px 3px rgba(255,255,255,.15) inset;
  }

  .bezel-ticks{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  .lcd-screen{
    position:relative;
    border-radius:8%;
    background:
      linear-gradient(160deg, var(--lcd-bg-1) 0%, var(--lcd-bg-2) 100%);
    box-shadow:
      0 3px 8px rgba(0,0,0,.55) inset,
      0 -1px 0 rgba(255,255,255,.25) inset;
    padding:clamp(12px,2.6vw,18px) clamp(10px,2.4vw,16px) clamp(14px,2.8vw,18px);
    overflow:hidden;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    transition: background .4s ease, transform .12s ease;
  }
  .lcd-screen:active{ transform:scale(.985); }

  .lcd-screen::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      to bottom, rgba(0,0,0,.05) 0px, rgba(0,0,0,.05) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  .lcd-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:var(--lcd-ink);
    font-weight:700;
    font-size:clamp(10px,1.7vw,13px);
    letter-spacing:.12em;
    margin-bottom:clamp(4px,1vw,8px);
  }
  .day-badge{ display:flex; align-items:center; gap:6px; }
  .live-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    animation:blink 2s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:.15; } }

  .top-right{ display:flex; align-items:center; gap:8px; }

  /* Botó de llengua, com un indicador de mode a la pantalla LCD */
  .lang-chip{
    position:relative;
    appearance:none;
    background:transparent;
    color:var(--lcd-ink);
    border:1.5px solid currentColor;
    border-radius:3px;
    font:inherit;
    font-weight:800;
    font-size:.9em;
    letter-spacing:.08em;
    line-height:1;
    padding:2px 5px 2px 6px;
    margin:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .lang-chip::after{ content:""; position:absolute; inset:-10px -8px; } /* àrea de toc més gran */
  .lang-chip:active{ transform:scale(.9); }

  .rain-icon{
    width:clamp(12px,2vw,15px);
    height:clamp(12px,2vw,15px);
    color:var(--accent);
    display:none;
  }
  .rain-icon.visible{
    display:block;
    animation:blink 2s steps(1) infinite;
  }

  .signal-bars{ display:flex; align-items:flex-end; gap:2px; height:10px; }
  .signal-bars span{
    display:block; width:3px; background:var(--lcd-ink); opacity:.75;
  }
  .signal-bars span:nth-child(1){ height:40%; }
  .signal-bars span:nth-child(2){ height:65%; }
  .signal-bars span:nth-child(3){ height:85%; }
  .signal-bars span:nth-child(4){ height:100%; }

  .seven-seg-time{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(1px,.4vw,3px);
    margin:clamp(4px,1.2vw,10px) 0;
  }
  .digit{ width:clamp(20px,5.4vw,38px); height:auto; display:block; }
  .digit .seg.on{ fill:var(--lcd-ink); }
  .digit .seg.off{ fill:var(--lcd-ghost); }
  .colon{ width:clamp(9px,2.3vw,16px); height:auto; display:block; }
  .colon.blink{ animation:blink 2s steps(1) infinite; }
  .colon .seg.on{ fill:var(--lcd-ink); }

  .lcd-date-row{
    text-align:center;
    color:var(--lcd-ink);
    font-weight:700;
    font-size:clamp(11px,2vw,15px);
    letter-spacing:.1em;
    margin-bottom:clamp(8px,1.6vw,12px);
  }

  .modules{
    display:flex;
    gap:clamp(2px,.7vw,6px);
    border-top:2px solid var(--lcd-line);
    padding-top:clamp(8px,1.6vw,12px);
  }
  .module{
    flex:1;
    min-width:0;
    text-align:center;
    color:var(--lcd-ink);
  }
  .module-label{
    display:block;
    font-size:clamp(6px,1vw,8px);
    font-weight:700;
    letter-spacing:.1em;
    opacity:.7;
    margin-bottom:2px;
  }
  .module-value{
    display:block;
    font-size:clamp(9.5px,1.7vw,13px);
    font-weight:800;
    letter-spacing:.01em;
    white-space:nowrap;
  }
  .module-divider{
    width:2px;
    background:var(--lcd-line);
  }

  .location-label{
    text-align:center;
    margin-top:clamp(12px,2.4vw,18px);
    font-size:clamp(16px,3vw,23px);
    font-weight:800;
    letter-spacing:.14em;
    color:var(--label);
    text-transform:uppercase;
  }

  .watch-buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:clamp(8px,1.8vw,12px);
    margin:clamp(14px,2.6vw,20px) auto 0;
  }
  .light-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:0;
    padding:clamp(8px,1.6vw,11px) clamp(16px,3vw,22px);
    border:none;
    border-radius:999px;
    background:linear-gradient(155deg, var(--metal-1) 0%, var(--metal-2) 100%);
    box-shadow:
      0 6px 14px -6px rgba(0,0,0,.6),
      0 1px 0 rgba(255,255,255,.12) inset,
      0 -2px 4px rgba(0,0,0,.4) inset;
    color:var(--btn-text);
    font-family:var(--mono);
    font-size:clamp(10px,1.6vw,12px);
    font-weight:700;
    letter-spacing:.18em;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition: color .4s ease, transform .12s ease;
  }
  .light-btn:active{ transform:scale(.96); }
  .light-icon{
    width:clamp(13px,2vw,16px);
    height:clamp(13px,2vw,16px);
    color:#8a8c8f;
    transition: color .4s ease, filter .4s ease;
  }
  .light-btn.active{ color:var(--accent-light); }
  .light-btn.active .light-icon{
    color:var(--accent-light);
    filter:drop-shadow(0 0 4px var(--accent));
  }
  /* Dos grups de botons: si no caben en una fila, passen a 2 + 2. */
  .btn-group{ display:flex; gap:clamp(8px,1.8vw,12px); }
  .light-btn.icon-only{ padding-left:clamp(10px,2vw,13px); padding-right:clamp(10px,2vw,13px); }
  .sound-toggle .icon-on{ display:none; }
  .sound-toggle.active .icon-on{ display:block; }
  .sound-toggle.active .icon-off{ display:none; }
  .light-btn.loading .light-icon{
    animation: blink 1s steps(1) infinite;
  }

  /* ============ CALENDAR ============ */
  .calendar-wrap{
    width:var(--panel-width);
    flex-shrink:0;
  }

  /* Deixem que el navegador gestioni el desplaçament vertical de la
     pàgina però ens quedem nosaltres el gest horitzontal, perquè
     el lliscament de mes es reconegui a l'instant, sense retard. */
  #calendarScreen{
    touch-action: pan-y;
  }

  .cal-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    color:var(--lcd-ink);
    margin-bottom:clamp(10px,2vw,16px);
  }
  .cal-label{
    font-size:clamp(9px,1.5vw,11px);
    font-weight:800;
    letter-spacing:.2em;
    opacity:.65;
  }
  .cal-nav{
    display:flex;
    align-items:baseline;
    gap:clamp(6px,1.6vw,11px);
  }
  .cal-month{
    font-size:clamp(13px,2.3vw,17px);
    font-weight:800;
    letter-spacing:.08em;
    min-width:9ch;
    text-align:center;
  }
  .cal-arrow{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--lcd-ink);
    font-family:var(--mono);
    font-size:clamp(15px,2.6vw,19px);
    font-weight:800;
    line-height:1;
    padding:2px 5px;
    margin:0;
    cursor:pointer;
    opacity:.7;
    -webkit-tap-highlight-color:transparent;
    transition: opacity .2s ease, transform .12s ease, color .4s ease;
  }
  .cal-arrow:active{ transform:scale(.8); }
  .cal-arrow:disabled{
    opacity:.2;
    cursor:default;
  }

  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:clamp(3px,.9vw,7px);
  }
  .cal-dayname{
    text-align:center;
    font-size:clamp(10px,1.7vw,13px);
    font-weight:700;
    letter-spacing:.06em;
    color:var(--lcd-ink);
    opacity:.55;
    padding-bottom:6px;
  }
  .cal-cell{
    position:relative;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(15px,2.6vw,20px);
    font-weight:700;
    color:var(--lcd-ink);
    border-radius:6px;
  }
  .cal-cell.empty{ visibility:hidden; }

  /* Caps de setmana: mateixa tinta, en un to més suau de l'accent
     — coherent amb qualsevol dels temes, sense competir amb "avui". */
  .cal-cell.weekend{
    color:var(--accent-light);
    opacity:.85;
  }

  /* Festius: tinta d'accent + puntet, i cursor per indicar que es pot tocar. */
  .cal-cell.holiday{
    color:var(--accent);
    font-weight:800;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .cal-cell.holiday.weekend{ color:var(--accent); }
  .cal-cell.holiday::after{
    content:"";
    position:absolute;
    bottom:12%;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--accent);
  }

  .cal-cell.today{
    background:var(--accent);
    color:var(--lcd-bg-1);
    box-shadow:0 0 0 2px rgba(0,0,0,.15) inset;
  }
  /* Si avui és també festiu, el puntet es dibuixa en positiu sobre el fons ple. */
  .cal-cell.today.holiday::after{
    background:var(--lcd-bg-1);
  }

  /* Finestreta emergent amb el nom de la festa */
  .holiday-popup{
    position:absolute;
    z-index:5;
    max-width:min(220px, 80%);
    padding:8px 12px;
    border-radius:8px;
    background:linear-gradient(160deg, var(--lcd-bg-1) 0%, var(--lcd-bg-2) 100%);
    border:1.5px solid var(--accent);
    box-shadow:0 10px 22px -8px rgba(0,0,0,.55);
    color:var(--lcd-ink);
    font-family:var(--mono);
    font-size:clamp(10px,1.7vw,12px);
    font-weight:700;
    letter-spacing:.03em;
    text-align:center;
    line-height:1.35;
    text-transform:none;
    opacity:0;
    transform:translateY(4px) scale(.96);
    pointer-events:none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .holiday-popup.visible{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  .holiday-popup::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-6px;
    width:11px;
    height:11px;
    background:var(--lcd-bg-2);
    border-right:1.5px solid var(--accent);
    border-bottom:1.5px solid var(--accent);
    transform:translateX(-50%) rotate(45deg);
  }
  .holiday-popup.arrow-top::after{
    bottom:auto;
    top:-6px;
    border-right:none;
    border-bottom:none;
    border-left:1.5px solid var(--accent);
    border-top:1.5px solid var(--accent);
  }

  /* Pantalla horitzontal baixa (mòbil girat): el panell s'encongeix,
     així que també encongim marges i lletres (que per defecte van segons
     l'amplada) perquè no quedi res tallat. Va al final del full d'estils
     perquè guanyi a les regles base. */
  @media (orientation:landscape) and (max-height:520px){
    .watch-case{ padding:8px; }
    .bezel{ padding:6px; }
    .lcd-screen{ padding:8px 9px 10px; }
    /* Mides proporcionals al panell: si el panell creix, tot creix igual. */
    .digit{ width:calc(var(--panel-width) * 0.105); }
    .colon{ width:calc(var(--panel-width) * 0.04); }
    .lcd-top{ font-size:calc(var(--panel-width) * 0.034); }
    .lcd-date-row{ font-size:calc(var(--panel-width) * 0.046); margin-bottom:6px; }
    .modules{ padding-top:6px; }
    .module-label{ font-size:calc(var(--panel-width) * 0.025); }
    .module-value{ font-size:calc(var(--panel-width) * 0.042); }
    .cal-header{ margin-bottom:6px; }
    .cal-label{ display:none; }
    .cal-nav{ width:100%; justify-content:space-between; }
    .cal-month{ font-size:calc(var(--panel-width) * 0.05); min-width:0; white-space:nowrap; }
    .cal-arrow{ font-size:calc(var(--panel-width) * 0.06); }
    .cal-grid{ gap:2px; }
    .cal-dayname{ font-size:calc(var(--panel-width) * 0.034); padding-bottom:2px; }
    .cal-cell{ font-size:calc(var(--panel-width) * 0.052); }
    .cal-cell.holiday::after{ width:4px; height:4px; bottom:6%; }
    .watch-buttons{ margin-top:10px; }
    .light-btn{ padding:6px 12px; font-size:10px; }
    .location-label{ font-size:calc(var(--panel-width) * 0.052); margin-top:8px; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="watch">
    <div class="watch-case">
      <div class="bezel">
        <div class="lcd-screen">
          <div class="lcd-top">
            <span class="day-badge"><span class="live-dot"></span><span id="dayName">---</span></span>
            <span class="top-right">
              <svg class="rain-icon" id="rainIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12a8 8 0 0 1 16 0Z"/>
                <path d="M12 12v8a2 2 0 0 1-4 0"/>
                <path d="M12 4v2"/>
              </svg>
              <button class="lang-chip" id="langBtn" type="button" aria-label="Llengua: Català">CA</button>
              <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
            </span>
          </div>

          <div class="seven-seg-time" id="timeDisplay"></div>

          <div class="lcd-date-row" id="dateDisplay">-- --- ----</div>

          <div class="modules">

              <span class="module-label" data-i18n="mTemp">TEMP</span>
              <span class="module-value" id="tempValue">-- °C</span>
            </div>
            <div class="module-divider"></div>
            <div class="module">
              <span class="module-label" data-i18n="mHumid">HUMIT</span>
              <span class="module-value" id="humidityValue">-- %</span>
            </div>
            <div class="module-divider"></div>
            <div class="module">
              <span class="module-label" data-i18n="mFeels">SENS</span>
              <span class="module-value" id="feelsValue">-- °C</span>
            </div>
            <div class="module-divider"></div>
            <div class="module">
              <span class="module-label" data-i18n="mAlt">ALT</span>
              <span class="module-value" id="altValue">-- m</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="watch-buttons">

          <svg class="light-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

          <span class="light-label" data-i18n="light">LLUM</span>

          <circle cx="12" cy="12" r="2"></circle>
          <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path>
        </svg>
          <span class="light-label">RAC1</span>
        </button>
      </div>
      <div class="btn-group">
        <button class="light-btn" id="speakBtn" type="button" data-i18n-aria="speak" aria-label="Digues l'hora">
          <span class="light-label" data-i18n="speakLabel">HORA</span>
        </button>
        <button class="light-btn icon-only sound-toggle" id="chimeToggle" type="button" aria-pressed="false" data-i18n-aria="chime" aria-label="Anuncia les hores en punt">
          <svg class="light-icon icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
          <svg class="light-icon icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>

  <div class="calendar-wrap">
    <div class="watch-case">
      <div class="bezel">
        <div class="lcd-screen" id="calendarScreen">
          <div class="cal-header">
            <span class="cal-label" data-i18n="cal">CAL</span>
            <div class="cal-nav">
              <button class="cal-arrow" id="calPrev" type="button" data-i18n-aria="prev" aria-label="Mes anterior">&#8249;</button>
              <span class="cal-month" id="calMonth">-- ----</span>
              <button class="cal-arrow" id="calNext" type="button" data-i18n-aria="next" aria-label="Mes següent">&#8250;</button>
            </div>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="holiday-popup" id="holidayPopup" role="status" aria-live="polite"></div>
        </div>
      </div>

</div>

<script>
/* ===================== SEVEN SEGMENT DIGITS ===================== */
const SEGMENTS = {
  '0':['a','b','c','d','e','f'],
  '1':['b','c'],
  '2':['a','b','g','e','d'],
  '3':['a','b','g','c','d'],
  '4':['f','g','b','c'],
  '5':['a','f','g','c','d'],
  '6':['a','f','g','e','c','d'],
  '7':['a','b','c'],
  '8':['a','b','c','d','e','f','g'],
  '9':['a','b','c','d','f','g'],
  '-':['g'],
  ' ':[]
};

/* Cada segment és un hexàgon amb els extrems tallats a 45°, perquè els
   pals verticals i horitzontals encaixin correctament als cantons
   (com en un display LCD/LED real) i cap número quedi més curt. */
const SEG_POLYGONS = {
  a:'3,7 7,3 33,3 37,7 33,11 7,11',
  g:'3,35 7,31 33,31 37,35 33,39 7,39',
  d:'3,63 7,59 33,59 37,63 33,67 7,67',
  f:'7,3 11,7 11,31 7,35 3,31 3,7',
  b:'33,3 37,7 37,31 33,35 29,31 29,7',
  e:'7,35 11,39 11,63 7,67 3,63 3,39',
  c:'33,35 37,39 37,63 33,67 29,63 29,39'
};

function digitSVG(char){
  const segs = SEGMENTS[char] !== undefined ? SEGMENTS[char] : [];
  let inner = '';
  for(const key of ['a','b','c','d','e','f','g']){
    const cls = segs.includes(key) ? 'seg on' : 'seg off';
    inner += `<polygon class="${cls}" points="${SEG_POLYGONS[key]}"/>`;
  }
  return `<svg class="digit" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

function colonSVG(){
  return `<svg class="colon blink" viewBox="0 0 16 70" xmlns="http://www.w3.org/2000/svg">
    <rect class="seg on" x="4" y="21" width="8" height="8" rx="1"/>
    <rect class="seg on" x="4" y="43" width="8" height="8" rx="1"/>
  </svg>`;
}

// Els dígits es construeixen un sol cop; cada segon només canviem quins
// segments estan encesos. Així l'animació dels dos punts no es reinicia
// (ara sí que parpellegen) i no refem 8 SVG cada segon.
let digitEls = null;

function initTimeDisplay(){
  const layout = ['d','d','colon','d','d','colon','d','d'];
  document.getElementById('timeDisplay').innerHTML = layout
    .map(t => t === 'colon' ? colonSVG() : digitSVG(' '))
    .join('');
  digitEls = Array.from(document.querySelectorAll('#timeDisplay .digit'))
    .map(svg => Array.from(svg.querySelectorAll('polygon')));
}

function renderTime(){
  if(!digitEls) initTimeDisplay();
  const now = new Date();
  const chars = [
    ...String(now.getHours()).padStart(2,'0'),
    ...String(now.getMinutes()).padStart(2,'0'),
    ...String(now.getSeconds()).padStart(2,'0')
  ];
  checkHourlyChime(now);
  const order = ['a','b','c','d','e','f','g'];
  chars.forEach((ch, i) => {
    const segs = SEGMENTS[ch] || [];
    digitEls[i].forEach((poly, k) => {
      const on = segs.includes(order[k]);
      poly.classList.toggle('on', on);
      poly.classList.toggle('off', !on);
    });
  });
}

/* ===================== L'HORA DITA EN CADA LLENGUA ===================== */
const hh24 = h => ((h % 24) + 24) % 24;

// Català: sistema de quarts (Optimot). Els quarts compten cap a l'hora
// següent: 7:15 «un quart de vuit», 7:30 «dos quarts de vuit»,
// 7:20 «un quart i cinc de vuit», 7:25 «dos quarts menys cinc de vuit»…
const CA_H = ['dotze','una','dues','tres','quatre','cinc','sis','set','vuit','nou','deu','onze'];
function caHora(h){ const n = hh24(h) % 12 || 12; return n === 1 ? 'la una' : 'les ' + CA_H[n % 12]; }
function caDe(h){ const w = CA_H[hh24(h) % 12]; return /^[aeiouàèéíòóú]/.test(w) ? "d'" + w : 'de ' + w; }
function caVerb(h){ return (hh24(h) % 12 || 12) === 1 ? 'És' : 'Són'; }
function caMin(n){ return (n === 5 || n === 10) ? String(n) : (n === 1 ? 'un minut' : n + ' minuts'); }
function caPeriode(H){
  const v = hh24(H);
  if(v < 6) return 'de la matinada';
  if(v < 12) return 'del matí';
  if(v < 15) return 'del migdia';
  if(v < 20) return 'de la tarda';
  if(v < 22) return 'del vespre';
  return 'de la nit';
}
function phraseCa(H, M){
  const per = caPeriode(H), next = H + 1;
  if(M === 0) return `${caVerb(H)} ${caHora(H)} en punt ${per}.`;
  const q = Math.floor(M / 15), r = M % 15;
  if(q === 0 && r <= 7) return `${caVerb(H)} ${caHora(H)} i ${caMin(r)} ${per}.`;
  if(q === 3 && r >= 8) return `${caVerb(next)} ${caHora(next)} menys ${caMin(15 - r)} ${per}.`;
  let quarts = q, extra = '';
  if(r > 0 && r <= 7) extra = ` i ${caMin(r)}`;
  else if(r >= 8){ quarts = q + 1; extra = ` menys ${caMin(15 - r)}`; }
  const qNom = ['', 'un quart', 'dos quarts', 'tres quarts'][quarts];
  return `${quarts === 1 ? 'És' : 'Són'} ${qNom}${extra} ${caDe(next)} ${per}.`;
}

function phraseOc(H, M){
  const W = ['dotze','una','doas','tres','quatre','cinc','sièis','sèt','uèch','nòu','dètz','onze'];
  const name = h => { const v = hh24(h); if(v === 0) return 'mièjanuèch'; if(v === 12) return 'miègjorn'; const n = v % 12 || 12; return n === 1 ? 'una ora' : `${W[n % 12]} oras`; };
  const verb = h => { const v = hh24(h); return (v === 0 || v === 12 || v % 12 === 1) ? 'Es' : 'Son'; };
  if(M === 0)  return `${verb(H)} ${name(H)}.`;
  if(M === 15) return `${verb(H)} ${name(H)} e quart.`;
  if(M === 30) return `${verb(H)} ${name(H)} e mièja.`;
  if(M === 45) return `${verb(H+1)} ${name(H+1)} mens lo quart.`;
  if(M < 30)   return `${verb(H)} ${name(H)} e ${M}.`;
  return `${verb(H+1)} ${name(H+1)} mens ${60 - M}.`;
}

function phraseFr(H, M){
  const name = h => { const v = hh24(h); if(v === 0) return 'minuit'; if(v === 12) return 'midi'; const n = v % 12 || 12; return n === 1 ? 'une heure' : `${n} heures`; };
  const per = h => { const v = hh24(h); if(v === 0 || v === 12) return ''; if(v < 12) return ' du matin'; if(v < 18) return " de l'après-midi"; return ' du soir'; };
  const demi = h => (hh24(h) === 0 || hh24(h) === 12) ? 'demi' : 'demie';
  if(M === 0)  return `Il est ${name(H)}${per(H)}.`;
  if(M === 15) return `Il est ${name(H)} et quart${per(H)}.`;
  if(M === 30) return `Il est ${name(H)} et ${demi(H)}${per(H)}.`;
  if(M === 45) return `Il est ${name(H+1)} moins le quart${per(H+1)}.`;
  if(M < 30)   return `Il est ${name(H)} ${M}${per(H)}.`;
  return `Il est ${name(H+1)} moins ${60 - M}${per(H+1)}.`;
}

function phraseEn(H, M){
  const name = h => { const v = hh24(h); if(v === 0) return 'midnight'; if(v === 12) return 'noon'; return String(v % 12 || 12); };
  const per = h => { const v = hh24(h); if(v === 0 || v === 12) return ''; if(v < 12) return ' in the morning'; if(v < 18) return ' in the afternoon'; if(v < 22) return ' in the evening'; return ' at night'; };
  const mins = n => n % 5 === 0 ? String(n) : (n === 1 ? 'one minute' : `${n} minutes`);
  if(M === 0){ const n = name(H); return (n === 'noon' || n === 'midnight') ? `It's ${n}.` : `It's ${n} o'clock${per(H)}.`; }
  if(M === 15) return `It's quarter past ${name(H)}${per(H)}.`;
  if(M === 30) return `It's half past ${name(H)}${per(H)}.`;
  if(M === 45) return `It's quarter to ${name(H+1)}${per(H+1)}.`;
  if(M < 30)   return `It's ${mins(M)} past ${name(H)}${per(H)}.`;
  return `It's ${mins(60 - M)} to ${name(H+1)}${per(H+1)}.`;
}

function phraseDe(H, M){
  const W = ['zwölf','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf'];
  const w = h => W[hh24(h) % 12];
  const per = h => { const v = hh24(h); if(v === 0) return ''; if(v < 5) return ' nachts'; if(v < 11) return ' morgens'; if(v < 13) return ' mittags'; if(v < 18) return ' nachmittags'; if(v < 22) return ' abends'; return ' nachts'; };
  const mins = n => n % 5 === 0 ? String(n) : (n === 1 ? 'eine Minute' : `${n} Minuten`);
  if(M === 0){ const v = hh24(H); if(v === 0) return 'Es ist Mitternacht.'; const n = v % 12 || 12; return `Es ist ${n === 1 ? 'ein' : W[n % 12]} Uhr${per(H)}.`; }
  if(M === 15) return `Es ist Viertel nach ${w(H)}${per(H)}.`;
  if(M === 30) return `Es ist halb ${w(H+1)}${per(H+1)}.`;
  if(M === 45) return `Es ist Viertel vor ${w(H+1)}${per(H+1)}.`;
  if(M < 30)   return `Es ist ${mins(M)} nach ${w(H)}${per(H)}.`;
  return `Es ist ${mins(60 - M)} vor ${w(H+1)}${per(H+1)}.`;
}

function phraseIt(H, M){
  const W = ['dodici','una','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici'];
  const name = h => { const v = hh24(h); if(v === 0) return 'mezzanotte'; if(v === 12) return 'mezzogiorno'; const n = v % 12 || 12; return n === 1 ? "l'una" : `le ${W[n % 12]}`; };
  const verb = h => { const v = hh24(h); return (v === 0 || v === 12 || v % 12 === 1) ? 'È' : 'Sono'; };
  const per = h => { const v = hh24(h); if(v === 0 || v === 12) return ''; if(v < 6) return ' di notte'; if(v < 12) return ' di mattina'; if(v < 18) return ' del pomeriggio'; return ' di sera'; };
  if(M === 0)  return `${verb(H)} ${name(H)} in punto${per(H)}.`;
  if(M === 15) return `${verb(H)} ${name(H)} e un quarto${per(H)}.`;
  if(M === 30) return `${verb(H)} ${name(H)} e mezza${per(H)}.`;
  if(M === 45) return `${verb(H+1)} ${name(H+1)} meno un quarto${per(H+1)}.`;
  if(M < 30)   return `${verb(H)} ${name(H)} e ${M}${per(H)}.`;
  return `${verb(H+1)} ${name(H+1)} meno ${60 - M}${per(H+1)}.`;
}

function phrasePt(H, M){
  const W = ['doze','uma','duas','três','quatro','cinco','seis','sete','oito','nove','dez','onze'];
  const name = h => { const v = hh24(h); if(v === 0) return 'meia-noite'; if(v === 12) return 'meio-dia'; return W[v % 12]; };
  const verb = h => { const v = hh24(h); return (v === 0 || v === 12 || v % 12 === 1) ? 'É' : 'São'; };
  const horas = h => { const v = hh24(h); if(v === 0 || v === 12) return ''; return v % 12 === 1 ? ' hora' : ' horas'; };
  const per = h => { const v = hh24(h); if(v === 0 || v === 12) return ''; if(v < 6) return ' da madrugada'; if(v < 12) return ' da manhã'; if(v < 20) return ' da tarde'; return ' da noite'; };
  if(M === 0)  return `${verb(H)} ${name(H)}${horas(H)} em ponto${per(H)}.`;
  if(M === 15) return `${verb(H)} ${name(H)} e um quarto${per(H)}.`;
  if(M === 30) return `${verb(H)} ${name(H)} e meia${per(H)}.`;
  if(M === 45) return `${verb(H+1)} ${name(H+1)} menos um quarto${per(H+1)}.`;
  if(M < 30)   return `${verb(H)} ${name(H)} e ${M}${per(H)}.`;
  return `${verb(H+1)} ${name(H+1)} menos ${60 - M}${per(H+1)}.`;
}

const TIME_PHRASE = { ca:phraseCa, oc:phraseOc, fr:phraseFr, en:phraseEn, de:phraseDe, it:phraseIt, pt:phrasePt };
function timePhrase(H, M){ return (TIME_PHRASE[currentLang] || phraseCa)(H, M); }

function getFestius(year){

function renderDate(){

let openHolidayKey = null; // "MM-DD" de la festa amb la finestreta oberta (si n'hi ha)
let calendarMonthOffset = 0; // 0 = mes actual; -2..-1 mesos anteriors; +1..+2 mesos posteriors

function getDisplayedDate(){
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth() + calendarMonthOffset, 1);
}

function buildCalendar(slideDirection){
  const displayed = getDisplayedDate();
  const year = displayed.getFullYear();
  const month = displayed.getMonth();
  document.getElementById('calMonth').textContent = `${T().months[month]} ${year}`;

  const grid = document.getElementById('calGrid');
  const previousOpenKey = openHolidayKey;
  hideHolidayPopup();

  const renderGridContent = () => {
    grid.innerHTML = '';

    T().days.slice(1).concat(T().days[0]).forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dayname';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDate = new Date(year, month, 1);
    const startOffset = (firstDate.getDay() + 6) % 7; // Monday = 0
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const now = new Date();
    const isCurrentMonthView = calendarMonthOffset === 0;
    const today = now.getDate();
    const festius = getFestius(year);
    let cellToReopen = null;

    for(let i=0; i<startOffset; i++){
      const el = document.createElement('div');
      el.className = 'cal-cell empty';
      grid.appendChild(el);
    }
    for(let d=1; d<=daysInMonth; d++){
      const dow = new Date(year, month, d).getDay(); // 0=diumenge, 6=dissabte
      const key = `${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const holidayName = festius[key] ? holidayLabel(festius[key]) : null;

      const el = document.createElement('div');
      let cls = 'cal-cell';
      if(isCurrentMonthView && d === today) cls += ' today';
      if(dow === 0 || dow === 6) cls += ' weekend';
      if(holidayName) cls += ' holiday';
      el.className = cls;
      el.textContent = d;

      if(holidayName){
        el.dataset.holidayKey = key;
        el.dataset.holidayName = holidayName;
        el.setAttribute('tabindex', '0');
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', `${d} ${T().months[month]}: ${holidayName}`);
        el.addEventListener('click', (e) => {
          e.stopPropagation(); // no ha de disparar el canvi de tema en tocar la pantalla
          toggleHolidayPopup(el, holidayName, key);
        });
        if(key === previousOpenKey) cellToReopen = el;
      }

      grid.appendChild(el);
    }

    if(cellToReopen){
      showHolidayPopup(cellToReopen, cellToReopen.dataset.holidayName, cellToReopen.dataset.holidayKey);
    }
  };

  if(slideDirection){
    // Petit lliscament visual: surt cap a un costat i el mes nou entra
    // per l'altre, per acompanyar el gest de l'usuari.
    grid.style.transition = 'transform .18s ease, opacity .18s ease';
    grid.style.transform = `translateX(${slideDirection > 0 ? '-14px' : '14px'})`;
    grid.style.opacity = '0';
    setTimeout(() => {
      renderGridContent();
      grid.style.transition = 'none';
      grid.style.transform = `translateX(${slideDirection > 0 ? '14px' : '-14px'})`;
      void grid.offsetWidth; // força el reflow perquè la transició següent s'apliqui
      grid.style.transition = 'transform .2s ease, opacity .2s ease';
      grid.style.transform = 'translateX(0)';
      grid.style.opacity = '1';
    }, 150);
  } else {
    renderGridContent();
  }
}

/* ===================== NAVEGACIÓ PER GEST (lliscar dreta/esquerra) ===================== */
let swipeHandled = false;

function bounceCalendar(direction){
  const grid = document.getElementById('calGrid');
  if(!grid) return;
  grid.style.transition = 'transform .16s ease';
  grid.style.transform = `translateX(${direction > 0 ? '-10px' : '10px'})`;
  setTimeout(() => { grid.style.transform = 'translateX(0)'; }, 140);
}

function navigateMonth(direction){
  const next = calendarMonthOffset + direction;
  if(next < -2 || next > 2){
    bounceCalendar(direction);
    return;
  }
  calendarMonthOffset = next;
  buildCalendar(direction);
  updateCalNavButtons();
}

function updateCalNavButtons(){
  const prevBtn = document.getElementById('calPrev');
  const nextBtn = document.getElementById('calNext');
  if(prevBtn) prevBtn.disabled = calendarMonthOffset <= -2;
  if(nextBtn) nextBtn.disabled = calendarMonthOffset >= 2;
}

function setupCalendarSwipe(){
  const screen = document.getElementById('calendarScreen');
  if(!screen) return;

  const SWIPE_THRESHOLD = 16; // molt sensible: n'hi ha prou amb un gest curt
  let startX = null, startY = null, activePointerId = null, triggered = false;

  const reset = () => {
    startX = null;
    startY = null;
    activePointerId = null;
    triggered = false;
  };

  screen.addEventListener('pointerdown', (e) => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    startX = e.clientX;
    startY = e.clientY;
    activePointerId = e.pointerId;
    triggered = false;
    try{ screen.setPointerCapture(e.pointerId); }catch(err){}
  });

  // Detectem el gest MENTRE es mou el dit, no només en aixecar-lo:
  // així respon a l'instant i no cal completar tot el recorregut.
  screen.addEventListener('pointermove', (e) => {
    if(startX === null || triggered || e.pointerId !== activePointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)){
      triggered = true;
      swipeHandled = true;
      setTimeout(() => { swipeHandled = false; }, 400);
      navigateMonth(dx < 0 ? 1 : -1); // esquerra → mes següent, dreta → mes anterior
    }
  });

  screen.addEventListener('pointerup', reset);
  screen.addEventListener('pointercancel', reset);
}

function setupCalNavButtons(){
  const prevBtn = document.getElementById('calPrev');
  const nextBtn = document.getElementById('calNext');
  if(prevBtn){
    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // no ha de disparar el canvi de tema en tocar la pantalla
      navigateMonth(-1);
    });
  }
  if(nextBtn){
    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      navigateMonth(1);
    });
  }
}

function showHolidayPopup(cell, name, key){
  const popup = document.getElementById('holidayPopup');
  const screen = cell.closest('.lcd-screen');
  if(!popup || !screen) return;

  popup.textContent = name;
  popup.classList.add('visible');
  openHolidayKey = key;

  // Posicionem la finestreta relativa a la pantalla LCD, per sobre de la
  // data tocada, i la fem caure a sota si no hi ha prou espai amunt.
  const screenRect = screen.getBoundingClientRect();
  const cellRect = cell.getBoundingClientRect();
  const popupWidth = popup.offsetWidth || 140;
  const popupHeight = popup.offsetHeight || 34;
  const gap = 10;

  let top = (cellRect.top - screenRect.top) - popupHeight - gap;
  let arrowTop = false;
  if(top < 0){
    top = (cellRect.bottom - screenRect.top) + gap;
    arrowTop = true;
  }
  let left = (cellRect.left - screenRect.left) + (cellRect.width / 2) - (popupWidth / 2);
  left = Math.max(4, Math.min(left, screenRect.width - popupWidth - 4));

  popup.style.top = `${top}px`;
  popup.style.left = `${left}px`;
  popup.classList.toggle('arrow-top', arrowTop);
}

function hideHolidayPopup(){
  const popup = document.getElementById('holidayPopup');
  if(popup) popup.classList.remove('visible');
  openHolidayKey = null;
}

function toggleHolidayPopup(cell, name, key){
  if(openHolidayKey === key){
    hideHolidayPopup();
  } else {
    showHolidayPopup(cell, name, key);
  }
}

const RAIN_THRESHOLD = 50; // % de probabilitat a partir del qual es considera "pluja imminent"

async function fetchPlaceName(lat, lon, isFallback){
  lastCoords = { lat, lon, isFallback };
  // El nom del lloc es demana en la llengua triada (l'occità, en català).
  const geoLang = currentLang === 'oc' ? 'ca' : currentLang;
  try{
    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${geoLang}`);
    const data = await res.json();
    const place = data.city || data.locality || data.principalSubdivision || '';
    placeState = { name: place, isFallback, failed: false };
  }catch(err){
    placeState = { name: '', isFallback, failed: true };
  }
  renderPlace();
}

function updateRainIcon(weather){
  const icon = document.getElementById('rainIcon');
  try{
    const isRainingNow = (weather.current.precipitation || 0) > 0;

    // Cerquem l'hora de l'array horari més propera a "ara" (comparant dates,
    // no cadenes de text, que és el que fallava abans).
    const now = new Date(weather.current.time);
    let idx = weather.hourly.time.indexOf(weather.current.time);
    if(idx === -1){
      let closestDiff = Infinity;
      weather.hourly.time.forEach((t, i) => {
        const diff = Math.abs(new Date(t) - now);
        if(diff < closestDiff){ closestDiff = diff; idx = i; }
      });
    }

    const window = idx !== -1
      ? weather.hourly.precipitation_probability.slice(idx, idx + 3)
      : [];
    const maxProb = window.length ? Math.max(...window) : 0;

    icon.classList.toggle('visible', isRainingNow || maxProb >= RAIN_THRESHOLD);
  }catch(err){
    icon.classList.remove('visible');
  }
}

async function fetchTempAlt(lat, lon, isFallback){
  fetchPlaceName(lat, lon, isFallback);

  try{
    const [weatherRes, elevRes] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation&hourly=precipitation_probability&forecast_days=1&timezone=auto`),
      fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`)
    ]);
    const weather = await weatherRes.json();
    const elev = await elevRes.json();

    if(weather && weather.current){
      ['tempValue','humidityValue','feelsValue'].forEach(id => { document.getElementById(id).dataset.na = '0'; });
      const t = Math.round(weather.current.temperature_2m);
      document.getElementById('tempValue').textContent = `${t}°C`;
      const h = Math.round(weather.current.relative_humidity_2m);
      document.getElementById('humidityValue').textContent = `${h}%`;
      const f = Math.round(weather.current.apparent_temperature);
      document.getElementById('feelsValue').textContent = `${f}°C`;
    }
    if(weather && weather.hourly){
      updateRainIcon(weather);
    }
    if(elev && elev.elevation && elev.elevation.length){
      const a = Math.round(elev.elevation[0]);
      document.getElementById('altValue').dataset.na = '0';
      document.getElementById('altValue').textContent = `${a} m`;
    }
  }catch(err){
    ['tempValue','altValue','humidityValue','feelsValue'].forEach(id => {
      const el = document.getElementById(id);
      el.textContent = T().ui.na;
      el.dataset.na = '1';
    });
  }
}

function initLocationData(){
  if('geolocation' in navigator){
    navigator.geolocation.getCurrentPosition(
      pos => fetchTempAlt(pos.coords.latitude, pos.coords.longitude, false),
      err => {
        console.warn('Geolocalització no disponible, s\'usa la ubicació de reserva:', err.message);
        fetchTempAlt(FALLBACK_COORDS.lat, FALLBACK_COORDS.lon, true);
      },
      { timeout: 10000, maximumAge: 0, enableHighAccuracy: true }
    );
  } else {
    fetchTempAlt(FALLBACK_COORDS.lat, FALLBACK_COORDS.lon, true);
  }
}

// Feed oficial de podcast de RAC1 per a "La Competència" (programa del
// migdia), confirmat via la fitxa oficial del programa a Apple Podcasts
// (id330984064 → feedUrl). Sempre reprodueix l'episodi més recent publicat.
const RAC1_POD_FEED = 'https://api.audioteca.rac1.cat/rss/la-competencia';
// Alternativa si el navegador no pot carregar el feed o l'àudio (p.ex. CORS):
// la fitxa oficial del podcast, des d'on també es pot escoltar.
const RAC1_FALLBACK_URL = 'https://podcasts.apple.com/es/podcast/la-compet%C3%A8ncia-programa-sencer/id330984064';

let racAudio = null;
let racEpisodeUrl = null;      // darrer episodi trobat
let racEpisodeCheckedAt = 0;   // quan es va consultar el feed (ms)
const RAC1_FEED_MAX_AGE = 60 * 60 * 1000; // el rellotge està obert dies: tornem a mirar el feed cada hora

function getRacAudio(){
  if(!racAudio){
    racAudio = new Audio();
    racAudio.preload = 'none';
    racAudio.addEventListener('waiting', () => setRacButtonState('loading'));
    racAudio.addEventListener('playing', () => setRacButtonState('playing'));
    racAudio.addEventListener('pause', () => setRacButtonState('idle'));
    racAudio.addEventListener('error', () => {
      setRacButtonState('idle');
      window.open(RAC1_FALLBACK_URL, '_blank', 'noopener');
    });
  }
  return racAudio;
}

function setRacButtonState(state){
  const btn = document.getElementById('racToggle');
  if(!btn) return;
  btn.classList.toggle('active', state === 'playing');
  btn.classList.toggle('loading', state === 'loading');
  btn.setAttribute('aria-pressed', String(state === 'playing'));
  const label = btn.querySelector('.light-label');
  if(label) label.textContent = state === 'loading' ? T().ui.loading : 'RAC1';
}

async function fetchLatestEpisodeUrl(){
  const res = await fetch(RAC1_POD_FEED);
  const text = await res.text();
  const xml = new DOMParser().parseFromString(text, 'text/xml');
  if(xml.querySelector('parsererror')) throw new Error('Feed il·legible');
  const enclosure = xml.querySelector('item enclosure');
  const url = enclosure && enclosure.getAttribute('url');
  if(!url) throw new Error('Cap episodi trobat al feed');
  return url;
}

async function toggleRac1(){
  const audio = getRacAudio();
  if(!audio.paused){
    audio.pause();
    setRacButtonState('idle');
    return;
  }
  setRacButtonState('loading');
  try{
    if(!racEpisodeUrl || Date.now() - racEpisodeCheckedAt > RAC1_FEED_MAX_AGE){
      racEpisodeUrl = await fetchLatestEpisodeUrl();
      racEpisodeCheckedAt = Date.now();
    }
    if(audio.src !== racEpisodeUrl) audio.src = racEpisodeUrl;
    await audio.play();
  }catch(err){
    // Feed o àudio inaccessibles (xarxa, CORS...): obrim la fitxa oficial.
    setRacButtonState('idle');
    window.open(RAC1_FALLBACK_URL, '_blank', 'noopener');
  }
}

/* ===================== VEU I AVÍS DE LES HORES ===================== */
// Veu preferida per a cada llengua. L'occità gairebé no té veus de síntesi
// als mòbils: s'intenta, i si no n'hi ha es llegeix amb veu catalana,
// que és la que s'hi assembla més.
const SPEECH_LANGS = {
  ca:['ca-ES','ca'], oc:['oc-FR','oc','ca-ES','ca'], fr:['fr-FR','fr'], en:['en-GB','en'],
  de:['de-DE','de'], it:['it-IT','it'], pt:['pt-PT','pt']
};
let voiceList = [];
function refreshVoices(){
  try{ voiceList = ('speechSynthesis' in window) ? window.speechSynthesis.getVoices() : []; }catch(err){ voiceList = []; }
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickVoice(lang){
  if(!voiceList.length) refreshVoices();
  const norm = s => (s || '').toLowerCase().replace('_', '-');
  for(const pref of (SPEECH_LANGS[lang] || [])){
    const p = norm(pref);
    const v = voiceList.find(x => norm(x.lang) === p) || voiceList.find(x => norm(x.lang).startsWith(p + '-'));
    if(v) return v;
  }
  return null;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const synth = window.speechSynthesis;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(currentLang);
  // Sense veu trobada: demanem la llengua i que el sistema triï la veu.
  // Per a l'occità, demanem català (millor que la veu per defecte del mòbil).
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = currentLang === 'oc' ? 'ca-ES' : SPEECH_LANGS[currentLang][0]; }
  u.rate = 0.95;
  const btn = document.getElementById('speakBtn');
  let ducked = false;
  u.onstart = () => {
    if(btn) btn.classList.add('active');
    // Si sona RAC1, abaixem el volum mentre parla (on el navegador ho permeti).
    if(racAudio && !racAudio.paused){ racAudio.volume = 0.2; ducked = true; }
  };
  const done = () => {
    if(btn) btn.classList.remove('active');
    if(ducked && racAudio) racAudio.volume = 1;
  };
  u.onend = done;
  u.onerror = done;
  synth.speak(u);
}

function speakNow(){
  const now = new Date();
  speak(timePhrase(now.getHours(), now.getMinutes()));
}

// Dos xiulets curts, com el senyal horari d'un Casio.
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playHourBeeps(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t0 = ctx.currentTime + 0.05;
  [0, 0.22].forEach(off => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = 2048;
    g.gain.setValueAtTime(0.0001, t0 + off);
    g.gain.exponentialRampToValueAtTime(0.06, t0 + off + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.12);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0 + off); o.stop(t0 + off + 0.14);
  });
}

const CHIME_STORAGE_KEY = 'kasioChime';
let chimeOn = false;
let lastChimeKey = null;

function setChimeUI(){
  const b = document.getElementById('chimeToggle');
  if(!b) return;
  b.classList.toggle('active', chimeOn);
  b.setAttribute('aria-pressed', String(chimeOn));
}
function toggleChime(){
  chimeOn = !chimeOn;
  try{ localStorage.setItem(CHIME_STORAGE_KEY, chimeOn ? '1' : '0'); }catch(err){}
  setChimeUI();
  if(chimeOn){ playHourBeeps(); setTimeout(() => speak(T().ui.chimeOn), 450); }
  else speak(T().ui.chimeOff);
}
// Es crida cada segon des de renderTime(): a cada hora en punt, xiulets + l'hora dita.
function checkHourlyChime(now){
  if(!chimeOn || now.getMinutes() !== 0) return;
  const key = now.toDateString() + '-' + now.getHours();
  if(key === lastChimeKey) return;
  lastChimeKey = key;
  if(now.getSeconds() > 20) return; // la pàgina estava adormida: no l'anunciem tard
  playHourBeeps();
  setTimeout(() => speak(timePhrase(now.getHours(), 0)), 600);
}

  });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => {
    const v = t.ui[el.dataset.i18nAria];
    if(v != null) el.setAttribute('aria-label', v);
  });
  const chip = document.getElementById('langBtn');
  if(chip){
    chip.textContent = currentLang.toUpperCase();
    chip.setAttribute('aria-label', `${t.ui.lang}: ${t.name}`);
  }
  ['tempValue','humidityValue','feelsValue','altValue'].forEach(id => {
    const el = document.getElementById(id);
    if(el && el.dataset.na === '1') el.textContent = t.ui.na;
  });
  const rac = document.getElementById('racToggle');
  if(rac && rac.classList.contains('loading')){
    const l = rac.querySelector('.light-label');
    if(l) l.textContent = t.ui.loading;
  }
  renderPlace();
}

function initLanguage(){
  try{
    const saved = localStorage.getItem(LANG_STORAGE_KEY);
    if(saved && LANGS.includes(saved)) currentLang = saved;
  }catch(err){}
}

function cycleLanguage(){
  currentLang = LANGS[(LANGS.indexOf(currentLang) + 1) % LANGS.length];
  try{ localStorage.setItem(LANG_STORAGE_KEY, currentLang); }catch(err){}
  applyStaticTexts();
  renderDate();
  buildCalendar();
  if(lastCoords) fetchPlaceName(lastCoords.lat, lastCoords.lon, lastCoords.isFallback);
}

function setupVoiceAndLanguage(){
  const chip = document.getElementById('langBtn');
  if(chip) chip.addEventListener('click', e => { e.stopPropagation(); cycleLanguage(); });
  const sp = document.getElementById('speakBtn');
  if(sp) sp.addEventListener('click', e => { e.stopPropagation(); getAudioCtx(); speakNow(); });
  const ch = document.getElementById('chimeToggle');
  if(ch) ch.addEventListener('click', e => { e.stopPropagation(); toggleChime(); });
  try{ chimeOn = localStorage.getItem(CHIME_STORAGE_KEY) === '1'; }catch(err){}
  setChimeUI();
}

/* ===================== INIT ===================== */
initLanguage();
initTheme();
setupVoiceAndLanguage();
setupCalendarSwipe();
setupCalNavButtons();
setupRac1Button();
renderTime();
renderDate();
buildCalendar();
updateCalNavButtons();
applyStaticTexts();
initLocationData();

setInterval(renderTime, 1000);
setInterval(() => {
  renderDate();
  buildCalendar();
}, 60 * 1000);
setInterval(initLocationData, 10 * 60 * 1000);
</script>
